version: '3.8'

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    restart: always

  backend:
    build: ./backend 
    image: amdp-registry.skala-ai.com/skala25a/sk035-langgraph-rag-backend:1.0.0
    container_name: rag-backend
    volumes:
      - ./backend/knowledge:/app/knowledge
      - ./backend/docs:/app/docs
      - ./backend/chroma_db:/app/chroma_db
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend 
    image: amdp-registry.skala-ai.com/skala25a/sk035-langgraph-rag-frontend:1.0.0
    container_name: rag-frontend
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:8000}

# 🔥 반드시 services 밖
volumes:
  jenkins_home: