name: Build and Deploy to EKS via Harbor

on:
  push:
    branches:
      - main

env:
  BACKEND_APP_NAME: sk035-backend
  FRONTEND_APP_NAME: sk035-frontend
  DEPLOYMENT_NAME: rag-app
  K8S_NAMESPACE: class-2

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
      HARBOR_PROJECT: ${{ secrets.HARBOR_PROJECT }}
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}

      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

      EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set image metadata
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          IMAGE_TAG=${GITHUB_RUN_NUMBER}-${SHORT_SHA}

          BACKEND_IMAGE=${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${BACKEND_APP_NAME}:${IMAGE_TAG}
          FRONTEND_IMAGE=${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${FRONTEND_APP_NAME}:${IMAGE_TAG}

          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "BACKEND_IMAGE=${BACKEND_IMAGE}" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=${FRONTEND_IMAGE}" >> $GITHUB_ENV

      - name: Log in to Harbor
        run: |
          echo "${HARBOR_PASSWORD}" | docker login ${HARBOR_REGISTRY} -u "${HARBOR_USERNAME}" --password-stdin

      - name: Build backend Docker image
        run: |
          docker build -t ${BACKEND_IMAGE} ./backend

      - name: Build frontend Docker image
        run: |
          docker build -t ${FRONTEND_IMAGE} ./frontend

      - name: Push backend image to Harbor
        run: |
          docker push ${BACKEND_IMAGE}

      - name: Push frontend image to Harbor
        run: |
          docker push ${FRONTEND_IMAGE}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region ${AWS_REGION} \
            --name ${EKS_CLUSTER_NAME}

      - name: Render deployment manifest
        run: |
          cp deployment.yaml deployment-rendered.yaml
          sed -i "s|__BACKEND_IMAGE__|${BACKEND_IMAGE}|g" deployment-rendered.yaml
          sed -i "s|__FRONTEND_IMAGE__|${FRONTEND_IMAGE}|g" deployment-rendered.yaml

      - name: Deploy to EKS
        run: |
          kubectl apply -n ${K8S_NAMESPACE} -f deployment-rendered.yaml
          kubectl apply -n ${K8S_NAMESPACE} -f service.yaml

      - name: Check rollout status
        run: |
          kubectl rollout status deployment/${DEPLOYMENT_NAME} -n ${K8S_NAMESPACE} --timeout=300s
          kubectl get pods -n ${K8S_NAMESPACE}
          kubectl get svc -n ${K8S_NAMESPACE}

      - name: Logout Harbor
        if: always()
        run: |
          docker logout ${HARBOR_REGISTRY} || true