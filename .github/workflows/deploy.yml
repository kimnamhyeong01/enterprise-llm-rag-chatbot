name: Build and Deploy to EKS via Harbor

on:
  push:
    branches:
      - main

env:
  BACKEND_APP_NAME: sk035-backend
  FRONTEND_APP_NAME: sk035-frontend
  DEPLOYMENT_NAME: rag-app
  K8S_NAMESPACE: class-2

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Load .env file
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          printf '%s\n' "$ENV_FILE_CONTENT" > .env
          python3 -c "
import os, re
with open('.env') as f:
    for line in f:
        line = line.rstrip('\n')
        if not line or line.startswith('#') or '=' not in line:
            continue
        key, _, value = line.partition('=')
        key = key.strip()
        if re.match(r'^[A-Za-z_][A-Za-z0-9_]*$', key):
            with open(os.environ['GITHUB_ENV'], 'a') as genv:
                genv.write(f'{key}<<GHEOF\n{value}\nGHEOF\n')
          "

      - name: Set image metadata
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          IMAGE_TAG=${GITHUB_RUN_NUMBER}-${SHORT_SHA}

          BACKEND_IMAGE=${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${BACKEND_APP_NAME}:${IMAGE_TAG}
          FRONTEND_IMAGE=${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${FRONTEND_APP_NAME}:${IMAGE_TAG}

          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "BACKEND_IMAGE=${BACKEND_IMAGE}" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=${FRONTEND_IMAGE}" >> $GITHUB_ENV

      - name: Debug Harbor vars
        run: |
          echo "REGISTRY=[${HARBOR_REGISTRY}]"
          echo "PROJECT=[${HARBOR_PROJECT}]"
          echo "USERNAME=[${HARBOR_USERNAME}]"
          echo "PASSWORD length=${#HARBOR_PASSWORD}"

      - name: Log in to Harbor
        run: |
          echo "${HARBOR_PASSWORD}" | docker login ${HARBOR_REGISTRY} -u "${HARBOR_USERNAME}" --password-stdin

      - name: Build backend Docker image
        run: |
          docker build -t ${BACKEND_IMAGE} ./backend

      - name: Build frontend Docker image
        run: |
          docker build -t ${FRONTEND_IMAGE} ./frontend

      - name: Push backend image to Harbor
        run: |
          docker push ${BACKEND_IMAGE}

      - name: Push frontend image to Harbor
        run: |
          docker push ${FRONTEND_IMAGE}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region ${AWS_REGION} \
            --name ${EKS_CLUSTER_NAME}

      - name: Render deployment manifest
        run: |
          cp deployment.yaml deployment-rendered.yaml
          sed -i "s|__BACKEND_IMAGE__|${BACKEND_IMAGE}|g" deployment-rendered.yaml
          sed -i "s|__FRONTEND_IMAGE__|${FRONTEND_IMAGE}|g" deployment-rendered.yaml

      - name: Deploy to EKS
        run: |
          kubectl apply -n ${K8S_NAMESPACE} -f deployment-rendered.yaml
          kubectl apply -n ${K8S_NAMESPACE} -f service.yaml

      - name: Check rollout status
        run: |
          kubectl rollout status deployment/${DEPLOYMENT_NAME} -n ${K8S_NAMESPACE} --timeout=300s
          kubectl get pods -n ${K8S_NAMESPACE}
          kubectl get svc -n ${K8S_NAMESPACE}

      - name: Logout Harbor
        if: always()
        run: |
          docker logout ${HARBOR_REGISTRY} || true
